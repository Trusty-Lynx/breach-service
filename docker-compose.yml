name: breach-service

services:
  app:
    build: .
    container_name: breach-service
    ports:
      - "7497:8080"
    restart: unless-stopped
    env_file: .env
    # trustylynx-net: Auth-Service (Login-Token prüfen). Keine eigene DB, deshalb kein DB-Netz.
    networks:
      - default

networks:
  default:
    name: trustylynx-net
    external: true
